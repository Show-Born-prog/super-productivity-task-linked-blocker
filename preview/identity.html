<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名前とアイコンの候補</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#202124;font:14px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:32px 24px 60px}h1{font-size:23px;margin:0 0 6px}h2{font-size:17px;margin:28px 0 12px}p{margin:4px 0 12px;color:#62676c}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{display:block;background:#fff;border:1px solid #d9dcdf;border-radius:8px;padding:18px;cursor:pointer}.card:has(input:checked){border-color:#202124;box-shadow:0 0 0 1px #202124}.card input{accent-color:#202124}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.badge{font-size:11px;border:1px solid #d9dcdf;border-radius:12px;padding:2px 7px}.hero{display:block;width:64px;height:64px;margin:16px auto 24px}.samples{display:flex;justify-content:center;align-items:center;gap:18px;height:36px}.samples img{display:block}.card strong{display:block;margin:12px 0 4px;font-size:16px}.card p{min-height:42px;font-size:12px}.source{font-size:11px;color:#62676c}.names .card p{min-height:0}.lang{display:block;font-size:12px;color:#62676c;margin-top:6px}.live{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toolbar{display:flex;align-items:center;gap:12px;padding:18px;border:1px solid #d9dcdf;border-radius:8px;background:#fff}.toolbar.dark{background:#242526;color:#fafafa;border-color:#454545}.toolbar.dark img{filter:invert(1)}.toolbar img{width:20px;height:20px}.small{font-size:12px;color:#62676c;margin-top:16px}a{color:inherit}.chosen{font-size:15px;font-weight:600;margin-top:18px}.hint{font-size:12px}.names strong{font-size:15px}@media(max-width:650px){main{padding:24px 14px}.grid{grid-template-columns:1fr}.live{grid-template-columns:1fr}.card .hero{margin:8px auto}.card p{min-height:0}}
</style>
<main><h1>名前とアイコンの候補</h1><p>白黒・フラット。名前とアイコンは別々に選べます。</p>
<h2>アイコン</h2><div class="grid">
<label class="card"><div class="top"><span><input type="radio" name="icon" value="ban" checked> A</span><span class="badge">選択済み</span></div><img class="hero" src="/identity-icons/ban.svg" alt="円に斜線の禁止マーク"><div class="samples"><img src="/identity-icons/ban.svg" width="16" height="16" alt="16px"><img src="/identity-icons/ban.svg" width="24" height="24" alt="24px"><img src="/identity-icons/ban.svg" width="32" height="32" alt="32px"></div><strong>禁止マーク</strong><p>「遮断する」がひと目で分かる。小さい表示でも読み取りやすい。</p><a class="source" href="https://lucide.dev/icons/ban" target="_blank" rel="noreferrer">Lucide / ban</a></label>
<label class="card"><div class="top"><span><input type="radio" name="icon" value="tag-off"> B</span></div><img class="hero" src="/identity-icons/tag-off.svg" alt="タグに斜線"><div class="samples"><img src="/identity-icons/tag-off.svg" width="16" height="16" alt="16px"><img src="/identity-icons/tag-off.svg" width="24" height="24" alt="24px"><img src="/identity-icons/tag-off.svg" width="32" height="32" alt="32px"></div><strong>タグ＋斜線</strong><p>タグとのつながりを強調。「タグを無効にする」とも読める。</p><a class="source" href="https://tabler.io/icons?icon=tag-off" target="_blank" rel="noreferrer">Tabler / tag-off</a></label>
<label class="card"><div class="top"><span><input type="radio" name="icon" value="shield-ban"> C</span></div><img class="hero" src="/identity-icons/shield-ban.svg" alt="盾に斜線"><div class="samples"><img src="/identity-icons/shield-ban.svg" width="16" height="16" alt="16px"><img src="/identity-icons/shield-ban.svg" width="24" height="24" alt="24px"><img src="/identity-icons/shield-ban.svg" width="32" height="32" alt="32px"></div><strong>盾＋斜線</strong><p>作業を守る印象。セキュリティ製品にも見えやすい。</p><a class="source" href="https://lucide.dev/icons/shield-ban" target="_blank" rel="noreferrer">Lucide / shield-ban</a></label>
</div>
<h2>名前</h2><div class="grid names">
<label class="card"><span><input type="radio" name="name" value="ブロッカー"> 1</span><strong>ブロッカー</strong><p>本体内で最もすっきりした名前。</p><span class="lang">EN: Blocker</span><span class="lang">中文: 屏蔽工具</span></label>
<label class="card"><span><input type="radio" name="name" value="アプリ・サイトブロッカー"> 2</span><strong>アプリ・サイトブロッカー</strong><p>何を遮断するかがそのまま伝わる。</p><span class="lang">EN: App &amp; Site Blocker</span><span class="lang">中文: 应用与网站屏蔽</span></label>
<label class="card"><span><input type="radio" name="name" value="タスク連動ブロッカー" checked> 3</span><strong>タスク連動ブロッカー（決定）</strong><p>タスクの再生・停止に合わせて遮断する。</p><span class="lang">EN案: Task-linked Blocker</span><span class="lang">中文案: 任务联动屏蔽</span></label>
</div>
<h2>小さいアイコンでの見え方</h2><div class="live"><div class="toolbar"><img class="live-icon" src="/identity-icons/ban.svg" alt="選択したアイコン"><span class="live-name">タスク連動ブロッカー</span></div><div class="toolbar dark"><img class="live-icon" src="/identity-icons/ban.svg" alt="選択したアイコン"><span class="live-name">タスク連動ブロッカー</span></div></div>
<p class="chosen" id="chosen">アイコン A / 名前 3</p><p class="hint">この画面は候補の比較用です。本体・Chromeの設定は変更しません。</p><p class="small">出典：Lucide（ISC、一部MIT）・Tabler（MIT）。<a href="/identity-icons/LICENSE-lucide.txt">Lucideのライセンス</a> / <a href="/identity-icons/LICENSE-tabler.txt">Tablerのライセンス</a><br>名称・日中英表記は提案です。ユーザーはAと「タスク連動ブロッカー」を選択しました。</p></main>
<script>document.addEventListener('change',()=>{const icon=document.querySelector('[name=icon]:checked'),name=document.querySelector('[name=name]:checked');document.querySelectorAll('.live-icon').forEach(el=>el.src='/identity-icons/'+icon.value+'.svg');document.querySelectorAll('.live-name').forEach(el=>el.textContent=name.value);document.getElementById('chosen').textContent='アイコン '+({ban:'A','tag-off':'B','shield-ban':'C'}[icon.value])+' / 名前 '+({'ブロッカー':'1','アプリ・サイトブロッカー':'2','タスク連動ブロッカー':'3'}[name.value]);});</script></html>
