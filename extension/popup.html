<style>
html{width:280px;min-width:280px;color-scheme:light dark;background:#f5f8f6}
body{box-sizing:border-box;margin:0;width:100%;height:64px;padding:16px;font:14px/20px system-ui;color:#193a2b;display:flex;align-items:center}
#status{margin:0;display:flex;align-items:center;gap:10px;white-space:nowrap}
