<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="product.name">__PRODUCT_NAME__</title><link rel="icon" href="icons/icon16.png">
<style>
html{width:280px;min-width:280px;color-scheme:light dark;background:#f5f8f6}
body{box-sizing:border-box;margin:0;width:100%;min-height:88px;padding:14px 16px;font:14px/20px system-ui;color:#193a2b;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.identity{display:flex;align-items:center;gap:8px;max-width:100%;font-size:12px;line-height:16px;font-weight:400;opacity:.65;white-space:nowrap}.identity img{width:16px;height:16px;flex:none}@media(prefers-color-scheme:dark){.identity img{filter:invert(1)}}
#status{margin:0;display:flex;align-items:center;gap:10px;white-space:nowrap}
#status::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:#808784}
#status[data-connection="connected"]::before{background:#287852}
#status[data-connection="error"]::before{background:#bd3434}
@media(prefers-color-scheme:dark){html{background:#202124}body{color:#e8eaed}#status[data-connection="connected"]::before{background:#81c995}#status[data-connection="error"]::before{background:#f28b82}}
</style>
<div class="identity"><img src="icons/icon16.png" width="16" height="16" alt=""><span data-i18n="product.name">__PRODUCT_NAME__</span></div><p id="status" role="status" aria-live="polite" data-connection="checking">__CHECKING__</p><script src="popup.mjs" type="module"></script></html>
